name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sahithi-kanjarla
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow down animation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for file in Path("dist").glob("*.svg"):
              text = file.read_text()

              # Increase animation duration by 2.5x
              def slow(match):
                  value = float(match.group(1))
                  return f'dur="{value * 2.5:g}s"'

              text = re.sub(
                  r'dur="([0-9.]+)s"',
                  slow,
                  text
              )

              file.write_text(text)
          PY

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}