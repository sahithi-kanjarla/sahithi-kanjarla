name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sahithi-kanjarla
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Slow down snake animation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          SPEED = 50

          for path in Path("dist").glob("*.svg"):
              svg = path.read_text()

              # Slow animation durations
              svg = re.sub(
                  r'(\bdur=")([0-9.]+)(s")',
                  lambda m: f'{m.group(1)}{float(m.group(2)) * SPEED:g}{m.group(3)}',
                  svg
              )

              # Slow animation start times
              svg = re.sub(
                  r'(\bbegin=")([0-9.]+)(s")',
                  lambda m: f'{m.group(1)}{float(m.group(2)) * SPEED:g}{m.group(3)}',
                  svg
              )

              path.write_text(svg)

          PY

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}